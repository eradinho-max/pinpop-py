[build]
  publish = "public"
  command = "echo PINPOP Netlify build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "multer", "helmet", "express-rate-limit", "cors", "@netlify/blobs"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/producto/*"
  to = "/.netlify/functions/api/producto/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/api/llms.txt"
  status = 200
  force = true
